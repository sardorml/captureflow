<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>CaptureFlow promo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand.css" />
    <style>
      html,
      body {
        width: 1920px;
        height: 1080px;
      }
      #root {
        background: var(--canvas);
      }
      .scene-slot {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-hx2w"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="11"
      data-width="1920"
      data-height="1080"
    >
      <div data-hf-id="hf-ww3t"
        id="scene-intro"
        class="scene-slot"
        data-composition-id="promo-intro"
        data-composition-src="compositions/promo-intro.html"
        data-start="0"
        data-duration="3"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>
      <div data-hf-id="hf-d9n1"
        id="scene-share"
        class="scene-slot"
        data-composition-id="promo-share"
        data-composition-src="compositions/promo-share.html"
        data-start="3"
        data-duration="4.5"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>
      <div data-hf-id="hf-1ps5"
        id="scene-outro"
        class="scene-slot"
        data-composition-id="promo-outro"
        data-composition-src="compositions/promo-outro.html"
        data-start="7.5"
        data-duration="3.5"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
