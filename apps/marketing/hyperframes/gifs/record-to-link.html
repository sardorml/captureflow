<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=960, height=540" />
    <title>Record to link (GIF)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="../assets/brand.css" />
    <style>
      html,
      body {
        width: 960px;
        height: 540px;
      }
      /* GIF keeps alpha, so the canvas is painted on the root, not <body>. */
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--canvas);
      }
      .window {
        position: absolute;
        inset: 60px 120px;
        overflow: hidden;
      }
      .window-bar {
        display: flex;
        gap: 8px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
      }
      .window-bar span {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--panel-2);
      }
      .slides {
        position: absolute;
        inset: 90px 40px 40px;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 18px;
      }
      .slides div {
        border-radius: 12px;
        background: var(--panel-2);
      }
      .rec {
        position: absolute;
        top: 22px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 18px;
      }
      .rec-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--danger);
      }
      .link {
        position: absolute;
        left: 50%;
        top: 50%;
        translate: -50% -50%;
        font-size: 26px;
        padding: 0.7em 1.3em;
        background: var(--fg);
        color: var(--canvas);
        border: none;
        box-shadow: 0 24px 60px rgb(0 0 0 / 0.5);
        white-space: nowrap;
        font-feature-settings: "calt" 0;
      }
      .link b {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-3dmy"
      id="root"
      data-composition-id="record-to-link"
      data-start="0"
      data-duration="4"
      data-width="960"
      data-height="540"
    >
      <div data-hf-id="hf-j021" id="window" class="window card clip" data-start="0" data-duration="4" data-layout-allow-overflow>
        <div data-hf-id="hf-85t8" class="window-bar"><span data-hf-id="hf-uckh"></span><span data-hf-id="hf-l73p"></span><span data-hf-id="hf-me0s"></span></div>
        <div data-hf-id="hf-vqjn" class="rec chip"><span data-hf-id="hf-7vwv" class="rec-dot"></span>Recording</div>
        <div data-hf-id="hf-vjdq" class="slides"><div data-hf-id="hf-yeow"></div><div data-hf-id="hf-y7yw"></div><div data-hf-id="hf-x11t"></div></div>
      </div>
      <div data-hf-id="hf-52wf" id="link" class="link chip" data-start="0" data-duration="4">
        captureflow.dev/r/<b data-hf-id="hf-gyq3">q3x9k2</b>
      </div>
    </div>
    <script>
      // Ends where it starts so the GIF loops without a jump.
      const tl = gsap.timeline({ paused: true });
      tl.set("#link", { scale: 0.5, opacity: 0 }, 0)
        .to(".rec-dot", { opacity: 0.2, duration: 0.35, repeat: 3, yoyo: true, ease: "sine.inOut" }, 0)
        .to("#window", { scale: 0.92, opacity: 0.35, duration: 0.45, ease: "power2.inOut" }, 1.4)
        .to("#link", { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.8)" }, 1.5)
        .to("#link", { scale: 0.5, opacity: 0, duration: 0.35, ease: "power2.in" }, 3.4)
        .to("#window", { scale: 1, opacity: 1, duration: 0.4, ease: "power2.out" }, 3.5);
      window.__timelines = window.__timelines || {};
      window.__timelines["record-to-link"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
