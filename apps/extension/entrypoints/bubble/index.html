<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      /* Fills the frame edge to edge and stays fully opaque: the circle is cut
         page-side. Rounding it here too left a rim of half-transparent pixels
         between the two edges, and those fringe white. */
      #cam {
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #16181d;
        transform: scaleX(-1);
      }
    </style>
  </head>
  <body>
    <video id="cam" autoplay muted playsinline></video>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
