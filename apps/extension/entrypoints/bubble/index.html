<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      /* Opaque edge to edge, with the circle cut page-side. This frame is
         out-of-process, so any partly-transparent pixel in it composites
         against a white base rather than against the page: rounding the corners
         in here leaves the frame's square showing as white. */
      #bubble {
        position: relative;
        width: 100%;
        height: 100%;
        background: #16181d;
      }
      #cam {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
        opacity: 0;
        transition: opacity 160ms ease-out;
      }
      body[data-state="ready"] #cam {
        opacity: 1;
      }
      #spinner {
        position: absolute;
        inset: 0;
        margin: auto;
        width: 26px;
        height: 26px;
        box-sizing: border-box;
        border: 3px solid rgba(255, 255, 255, 0.16);
        border-top-color: rgba(255, 255, 255, 0.7);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      body[data-state="ready"] #spinner {
        display: none;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body data-state="loading">
    <div id="bubble">
      <video id="cam" autoplay muted playsinline></video>
      <div id="spinner"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
