name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A successful run can't be re-run from the API, so without this the only way
  # to redeploy an unchanged main is an empty commit. Needed when something
  # outside the repo drops what the deploy owns — e.g. the custom_domain route's
  # DNS record.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Format gate: the whole tree must already match Prettier. Cheapest check,
      # so run it first to fail fast. Fix locally with `pnpm format`.
      - run: pnpm format:check
      # Migrations run before the new worker goes live, so the code already
      # deployed (the PR's base, or the previous main commit) must survive
      # them: no dropping or renaming what it still reads.
      - name: Check migrations against the deployed code
        if: github.event_name != 'workflow_dispatch'
        run: node scripts/check-migrations.mjs ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
      - run: node --test scripts/check-migrations.test.mjs
      - run: pnpm typecheck
      - run: pnpm --filter @captureflow/web test
      - run: pnpm --filter @captureflow/extension test
      # The admin worker deploys off this same gate, so its package has to be
      # covered here — auth, hashing, and input validation all live there.
      - run: pnpm --filter @captureflow/admin test
      # Campaign SQL, unsubscribe tokens and the mailer's send loop.
      - run: pnpm --filter @captureflow/mail test
      - run: pnpm --filter @captureflow/mailer test
      # The Docker image's D1/R2/queue stand-ins.
      - run: pnpm --filter @captureflow/selfhost test
      - run: pnpm build

  # Server-side secret scan — the safety net for the local pre-push hook (which
  # contributors can skip with --no-verify or simply not have installed). Runs
  # on every push and PR; full history (fetch-depth: 0) so a secret can't slip
  # in via an older commit. Uses .gitleaks.toml. Free for public repos.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Auto-deploy the web worker (apps/web) to Cloudflare on every push to main,
  # but ONLY after `build` (typecheck + next build) passes. PRs never deploy —
  # the `if` limits this job to push events on the main branch.
  #
  # Required repo secrets (Settings → Secrets and variables → Actions):
  #   CLOUDFLARE_API_TOKEN   — API token scoped to this account with
  #                            Workers Scripts: Edit, D1: Edit, and
  #                            Workers R2 Storage: Edit (the "Edit Cloudflare
  #                            Workers" template + D1 covers it).
  #   CLOUDFLARE_ACCOUNT_ID  — the Cloudflare account id.
  # Worker RUNTIME secrets (BETTER_AUTH_SECRET, OAuth keys, …) live in
  # Cloudflare via `wrangler secret put` and are NOT needed here — deploy only
  # publishes code + the bindings/vars/crons declared in wrangler.jsonc.
  deploy:
    needs: [build, secret-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Never let two deploys run at once; queue (don't cancel) so an in-flight
    # publish always finishes.
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first, so the old worker serves the new schema for seconds (the
      # upload), not for the length of a build. Migrations must stay additive;
      # the build job's migration check enforces that. Never apply them by hand.
      - name: Build worker
        run: pnpm --filter @captureflow/web cf:build
      - name: Apply D1 migrations (production)
        run: pnpm --filter @captureflow/web db:apply:remote
      # Bindings (D1/R2), vars, and cron triggers come from apps/web/wrangler.jsonc.
      - name: Upload worker
        id: upload
        run: pnpm --filter @captureflow/web cf:upload
      - name: Smoke test
        run: node scripts/smoke.mjs https://captureflow.dev
      # A rollback restores the previous code only; migrations stay applied,
      # which is safe because they are additive.
      - name: Roll back on failed smoke test
        if: failure() && steps.upload.outcome == 'success'
        working-directory: apps/web
        run: npx wrangler rollback --yes --message "Smoke test failed for ${{ github.sha }}"

  # The operator panel (apps/admin) is its own Worker on admin.captureflow.dev.
  # It needs `deploy` first, not just `build`: it binds the same D1 as the web
  # worker but ships no migrations of its own, so it must not go live until that
  # job has applied them — otherwise its first request hits missing tables.
  #
  # ADMIN_SESSION_SECRET and ADMIN_SETUP_TOKEN are Worker runtime secrets set
  # with `wrangler secret put`, so they are deliberately absent here.
  deploy-admin:
    needs: [build, secret-scan, deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-deploy-admin
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build & deploy admin worker
        run: pnpm --filter @captureflow/admin-app cf:deploy

  # The mailer (apps/mailer) consumes the captureflow-mail queue that the admin
  # writes to and serves mail.captureflow.dev/unsubscribe. Like the admin it
  # reads tables that apps/web migrates, so it waits for `deploy` too.
  # RESEND_API_KEY and MAIL_UNSUBSCRIBE_SECRET are runtime secrets set with
  # `wrangler secret put`, not here.
  deploy-mailer:
    needs: [build, secret-scan, deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-deploy-mailer
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy mailer worker
        run: pnpm --filter @captureflow/mailer cf:deploy

  # The docs are an assets-only Worker of their own (apps/docs/wrangler.jsonc),
  # so this deploys on the same gate as the app but in its own concurrency
  # group — neither blocks or breaks the other. The Workers token covers it; no
  # Pages permission is needed.
  deploy-docs:
    needs: [build, secret-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-deploy-docs
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # vitepress build → wrangler deploy (assets-only worker).
      - name: Build & deploy docs
        run: pnpm --filter @captureflow/docs cf:deploy
